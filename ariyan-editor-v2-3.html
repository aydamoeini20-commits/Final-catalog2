<style>

  :root{
    --ink:#241F1C; --inkSoft:#5C544C; --paper:#F3ECDC; --card:#FFFDF8;
    --navy:#0F3A52; --gold:#C79A4B; --terracotta:#BE6A3B; --line:#E3D9C4; --danger:#B23A3A;
  }
  *{box-sizing:border-box;}

    font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;}
  .tabs button.active{color:#fff;border-color:var(--gold);}

  .panel{display:none;padding:16px 16px 100px;}
  .panel.active{display:block;}

  .section{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px;
    box-shadow:0 1px 6px rgba(0,0,0,.06);}
  .section h2{font-size:14px;margin:0 0 10px;color:var(--navy);}
  .badge{display:inline-block;font-size:9.5px;padding:2px 8px;border-radius:999px;margin-right:6px;}
  .badge.fixed{background:#e7dfc9;color:var(--inkSoft);}
  .badge.custom{background:#dcecea;color:#1c5f57;}
  label{display:block;font-size:11.5px;color:var(--inkSoft);margin:10px 0 4px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=tel],input[type=email],textarea,select{

    font-family:inherit;font-size:13px;background:#fff;color:var(--ink);}
  textarea{resize:vertical;min-height:60px;line-height:1.7;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .btn{border:none;border-radius:999px;padding:10px 16px;font-family:inherit;font-size:12.5px;
    font-weight:600;cursor:pointer;}
  .btn-gold{background:var(--gold);color:var(--navy);}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-danger{background:none;color:var(--danger);border:1px solid #E7C6C6;}
  .btn-block{width:100%;}

  .catlist{display:flex;flex-direction:column;gap:8px;}
  .catrow{display:flex;align-items:center;gap:10px;background:#fff;
    border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
  .catrow .info{flex:1;min-width:0;}
  .catrow .count{font-size:10.5px;color:var(--inkSoft);}
  .catrow input[type=text]{margin-bottom:2px;}

  .prodcard{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fff;}
  .prodcard .thumbrow{display:flex;gap:10px;align-items:center;}
  .prodcard img,.prodcard .noimg{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--line);
    display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--inkSoft);flex-shrink:0;}
  .prodcard .info{flex:1;min-width:0;}
  .prodcard .pname{font-size:13px;font-weight:600;}
  .prodcard .pmeta{font-size:10.5px;color:var(--inkSoft);}
  .prodcard .actions{display:flex;gap:6px;margin-top:8px;}

  .imgpicker{display:flex;align-items:center;gap:10px;margin-top:6px;}
  .imgpicker img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--line);}
  .fileBtn{position:relative;overflow:hidden;}
  .fileBtn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}

  .backline{display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer;color:var(--navy);
    font-size:13px;font-weight:600;}

  .savebar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--card);
    border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;z-index:45;}
  .savebar .btn{flex:1;}
  .toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
    padding:8px 18px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;
    max-width:90%;text-align:center;}
  .toast.show{opacity:1;}

  .pv-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .pv-card h3{margin:0 0 6px;font-size:14px;color:var(--navy);}
  .pv-card p{margin:0;font-size:12px;color:var(--inkSoft);line-height:1.9;}
  .pv-img{width:100%;border-radius:10px;margin-bottom:10px;object-fit:cover;max-height:180px;}
  .pv-prod{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);}
  .pv-prod:first-of-type{border-top:none;}
  .pv-prod img,.pv-prod .noimg{width:50px;height:50px;border-radius:8px;object-fit:cover;background:var(--line);flex-shrink:0;}
  .pv-prod .n{font-size:12.5px;font-weight:600;}
  .pv-prod .s{font-size:11px;color:var(--terracotta);}
</style>

let DATA = null;
let editView = {screen:'menu'};

/* ---------------- storage: localStorage, works fully offline standalone ---------------- */
const LS_KEY = 'ariyan-catalog-data-v2';
function loadData(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ DATA = JSON.parse(raw); ensureProductBuckets(); return; }
  }catch(e){}
  DATA = defaultData();
  ensureProductBuckets();
  persist();
}
function ensureProductBuckets(){
  DATA.categories.forEach(c=>{ if(!DATA.products[c.id]) DATA.products[c.id] = []; });
}
function persist(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }catch(e){ console.error(e); }
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}
function saveAll(){
  persist();
  renderPreview();
  showToast('ذخیره شد ✓');
}
function resetSample(btn){
  if(btn.dataset.armed !== '1'){
    btn.dataset.armed = '1';
    const old = btn.textContent;
    btn.textContent = 'مطمئنید؟ دوباره بزنید';
    setTimeout(()=>{ btn.dataset.armed=''; btn.textContent = old; }, 2500);
    return;
  }
  btn.dataset.armed = '';
  DATA = defaultData();
  persist();
  editView = {screen:'menu'};
  renderEdit();
  renderPreview();
  showToast('بازگردانی شد');
}

/* ---------------- image helper ---------------- */
function fileToDataURL(file, maxSize=1000, quality=0.9){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxSize){ h=h*maxSize/w; w=maxSize; }
        else if(h>maxSize){ w=w*maxSize/h; h=maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function esc(s){ return (s||'').toString().replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function firstImg(p){ return (p.images && p.images[0]) || p.img || ''; }

/* ================= TABS ================= */
function switchTab(which){
  document.getElementById('tabPreview').classList.toggle('active', which==='preview');
  document.getElementById('tabEdit').classList.toggle('active', which==='edit');
  document.getElementById('previewPanel').classList.toggle('active', which==='preview');
  document.getElementById('editPanel').classList.toggle('active', which==='edit');
  document.getElementById('editSaveBar').style.display = which==='edit' ? 'flex' : 'none';
  if(which==='preview') renderPreview();
}

/* ================= EDIT UI ================= */
function goEdit(screen, catId, prodId){
  editView = {screen, catId, prodId};
  if(screen === 'form'){
    const p = prodId ? (DATA.products[catId]||[]).find(x=>x.id===prodId) : null;
    formImages = p ? [...(p.images || (p.img ? [p.img] : []))] : [];
  }
  renderEdit();
}
function renderEdit(){
  const root = document.getElementById('editRoot');
  if(editView.screen==='menu') root.innerHTML = menuHTML();
  else if(editView.screen==='brand') root.innerHTML = brandHTML();
  else if(editView.screen==='contact') root.innerHTML = contactHTML();
  else if(editView.screen==='cats') root.innerHTML = catsHTML();
  else if(editView.screen==='products') root.innerHTML = productsHTML(editView.catId);
  else if(editView.screen==='form') root.innerHTML = productFormHTML(editView.catId, editView.prodId);
  bindEvents();
}

function catsHTML(){

    return `<div class="catrow">
      <div class="info">
        <input type="text" style="margin-bottom:4px;" value="${esc(c.label)}" onchange="renameCat('${c.id}', this.value)">
        <div class="count">${badge}${n} محصول</div>
      </div>
    </div>
    <div style="display:flex;gap:6px;margin:-4px 0 10px;">
      <button class="btn btn-outline" style="flex:1;" onclick="goEdit('products','${c.id}')">محصولات</button>
      <button class="btn btn-danger" onclick="deleteCat('${c.id}', this)">حذف دسته</button>
    </div>`;
  }).join('');
  return `
  <div class="backline" onclick="goEdit('menu')">‹ بازگشت به منو</div>
  <div class="section">
    <h2>دسته‌بندی‌ها</h2>

  Object.keys(bmap).forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', ()=>{ b[bmap[id]] = el.value; });
  });
  const cmap = {f_phone:'phone', f_email:'email', f_address:'address',
    f_instagram:'instagram', f_website:'website', f_telegram:'telegram'};
  Object.keys(cmap).forEach(id=>{

    if(el) el.addEventListener('input', ()=>{ c[cmap[id]] = el.value; });

  const pimgFileNew = document.getElementById('f_pimgFileNew');
  if(pimgFileNew) pimgFileNew.addEventListener('change', async (e)=>{
    if(e.target.files[0]){
      const url = await fileToDataURL(e.target.files[0], 1000, 0.9);

function saveProductForm(catId, prodId){
  const name = document.getElementById('f_pname').value.trim();
  const desc = document.getElementById('f_pdesc').value.trim();
  if(!name){ showToast('نام محصول را وارد کنید'); return; }
  if(!DATA.products[catId]) DATA.products[catId] = [];
  if(prodId){
    const p = DATA.products[catId].find(x=>x.id===prodId);
    Object.assign(p, {name, desc, images: [...formImages]});
    delete p.img; // migrate away from the old single-image field
  } else {
    DATA.products[catId].push({id:uid(), name, desc, images: [...formImages]});
  }
  persist();
  showToast('ذخیره شد ✓');
  goEdit('products', catId);
}
function deleteProduct(catId, prodId, btn){
  if(btn.dataset.armed !== '1'){

    btn.textContent = 'مطمئنید؟';

    return;
  }
  DATA.products[catId] = (DATA.products[catId]||[]).filter(x=>x.id!==prodId);

  renderEdit();

/* ================= EXPORT ================= */
// data.json: same shape as DATA, but every image becomes a filename
// ("images/xxx.jpg") pointing into the zip's images/ folder, instead of an
// embedded base64 string.
function buildDataJson(imageManifest){
  const clone = JSON.parse(JSON.stringify(DATA));
  let n = 0;
  function fileFor(dataUrl, hint){
    n++;
    const ext = /image\/png/.test(dataUrl) ? 'png' : 'jpg';
    const name = `images/${hint}-${n}.${ext}`;
    imageManifest.push({name, dataUrl});
    return name;
  }
  Object.keys(clone.products).forEach(catId=>{
    clone.products[catId].forEach(p=>{
      if(p.images && p.images.length){
        p.images = p.images.map(im => fileFor(im, (p.name||'product').replace(/\s+/g,'_')));
      }
      delete p.img;
    });
  });
  return JSON.stringify(clone, null, 2);
}

async function downloadZIP(){
  if(typeof JSZip === 'undefined'){
    showToast('کتابخونه‌ی ساخت ZIP لود نشد — اینترنت رو چک کنید و دوباره امتحان کنید');
    return;
  }
  const imageManifest = [];
  const dataJson = buildDataJson(imageManifest);
  const zip = new JSZip();
  zip.file('data.json', dataJson);
  const imgFolder = zip.folder('images');
  imageManifest.forEach(({name, dataUrl})=>{
    const base64 = dataUrl.split(',')[1];
    const fname = name.replace('images/','');
    imgFolder.file(fname, base64, {base64:true});
  });
  try{
    const blob = await zip.generateAsync({type:'blob'});
    const b = DATA.brand;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (b.nameEn||'catalog').replace(/\s+/g,'-') + '-data.zip';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
    showToast('فایل ZIP دانلود شد ✓');
  }catch(e){
    console.error(e);
    showToast('ساخت ZIP کار نکرد — از دکمه‌ی «نمایش و کپی متن» استفاده کنید');
  }
}

function showCodeBox(){
  const clone = JSON.parse(JSON.stringify(DATA));
  Object.keys(clone.products).forEach(catId=>{
    clone.products[catId].forEach(p=>{ p.images = (p.images||[]).map(()=>'[عکس - فقط تو ZIP هست]'); delete p.img; });
  });
  document.getElementById('codeBox').value = JSON.stringify(clone, null, 2);
  document.getElementById('codeBoxWrap').style.display = '';
  showToast('متن آماده شد ✓ — پایین صفحه');
}

function copyCodeBox(){
  const box = document.getElementById('codeBox');
  box.focus();
  box.select();
  box.setSelectionRange(0, box.value.length);
  let done = false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(box.value).then(()=>showToast('کپی شد ✓')).catch(()=>fallbackCopy(box));
      done = true;
    }
  }catch(e){}
  if(!done) fallbackCopy(box);
}
function fallbackCopy(box){
  try{
    const ok = document.execCommand('copy');
    showToast(ok ? 'کپی شد ✓' : 'خودتون متن رو انتخاب و کپی کنید');
  }catch(e){
    showToast('خودتون متن رو انتخاب و کپی کنید');
  }
}
